<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOM Prayer Times Widget (Emerald)</title>
    <meta name="version" content="2.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: transparent;
            color: #1E1E1E;
            padding: 20px;
        }

        .widget-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Header */
        .widget-header {
            background: linear-gradient(135deg, #0A2F35 0%, #00A86B 100%);
            color: #FFFFFF;
            padding: 25px 30px;
            text-align: center;
        }

        .widget-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .widget-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .widget-date {
            font-size: 15px;
            margin-top: 10px;
            opacity: 0.95;
        }

        .date-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
        }

        .gregorian-date, .hijri-date {
            font-size: 15px;
            opacity: 0.95;
        }

        .hijri-date {
            font-size: 14px;
            opacity: 0.85;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .gregorian-date, .hijri-date {
                font-size: 13px;
            }
            
            .hijri-date {
                font-size: 12px;
            }
        }

        /* Store Icons Section */
        .store-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .store-link {
            display: inline-block;
            transition: transform 0.2s ease;
            text-decoration: none;
        }

        .store-link:hover {
            transform: scale(1.05);
        }

        .store-icon {
            height: 50px;
            width: auto;
        }

        /* Content */
        .widget-content {
            padding: 30px;
        }

        /* Section Title */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #0A2F35;
            margin-bottom: 15px;
            border-bottom: 3px solid #00A86B;
            padding-bottom: 8px;
        }

        /* Prayer Grid */
        .prayers-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .prayer-card {
            background-color: #F8F9FA;
            border: 2px solid #E9ECEF;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .prayer-card:hover {
            border-color: #00A86B;
            box-shadow: 0 4px 12px rgba(0, 168, 107, 0.15);
        }

        .prayer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .prayer-name-en {
            font-size: 22px;
            font-weight: 700;
            color: #0A2F35;
        }

        .prayer-name-ar {
            font-size: 18px;
            color: #6C757D;
            font-weight: 600;
        }

        .prayer-times-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .time-box {
            background-color: #FFFFFF;
            border: 1px solid #DEE2E6;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .time-label {
            font-size: 11px;
            font-weight: 600;
            color: #6C757D;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .time-value {
            font-size: 20px;
            font-weight: 700;
            color: #0A2F35;
        }

        /* Special Prayers */
        .special-prayers-grid {
            display: grid;
            gap: 12px;
        }

        .special-card {
            background-color: #F8F9FA;
            border: 2px solid #E9ECEF;
            border-radius: 10px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .special-card:hover {
            border-color: #00A86B;
            box-shadow: 0 4px 12px rgba(0, 168, 107, 0.15);
        }

        .special-name-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .special-name-en {
            font-size: 18px;
            font-weight: 700;
            color: #0A2F35;
        }

        .special-name-ar {
            font-size: 14px;
            color: #6C757D;
            font-weight: 600;
        }

        .special-time {
            font-size: 18px;
            font-weight: 700;
            color: #00A86B;
        }

        /* Footer */
        .widget-footer {
            background-color: #F8F9FA;
            padding: 20px 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            border-top: 1px solid #E9ECEF;
        }

        .footer-item {
            text-align: center;
        }

        .footer-label {
            font-size: 11px;
            color: #6C757D;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .footer-value {
            font-size: 13px;
            color: #0A2F35;
            font-weight: 600;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            font-size: 24px;
            font-weight: 700;
            color: #00A86B;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .widget-content {
                padding: 20px;
            }

            .prayer-times-row {
                grid-template-columns: 1fr;
            }

            .widget-title {
                font-size: 24px;
            }

            .prayer-name-en {
                font-size: 18px;
            }

            .time-value {
                font-size: 18px;
            }
        }

        /* ===== v2: Today | Tomorrow tabs ===== */
        .daily-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 15px; }
        .daily-header .section-title { margin-bottom: 0; }
        .section-title.tomorrow { color: #B7791F; }
        .day-tabs { display: inline-flex; gap: 4px; padding: 4px; background: #F1F3F5; border-radius: 999px; }
        .day-tab { border: 0; background: transparent; color: #495057; font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: background-color 0.25s ease, color 0.25s ease; }
        .day-tab:hover { color: #00A86B; }
        .day-tab.active { background: #00A86B; color: #FFFFFF; }
        .day-tab:focus-visible { outline: 2px solid #00A86B; outline-offset: 2px; }

        /* ===== v2: next prayer highlight and gentle animations =====
           Calm on purpose, and switched off when the visitor's device asks for reduced motion. */
        .prayer-card.next-prayer,
        .special-card.next-prayer {
            border-color: #00A86B;
            background-color: rgba(0, 168, 107, 0.06);
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 2px 6px rgba(0, 168, 107, 0.12); }
            50%      { box-shadow: 0 0 18px rgba(0, 168, 107, 0.35); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }
        .widget-container.widget-enter { animation: fadeUp 0.6s ease-out both; }
        .animate-in > * { animation: fadeUp 0.6s ease-out both; }
        .animate-in > *:nth-child(2) { animation-delay: 0.06s; }
        .animate-in > *:nth-child(3) { animation-delay: 0.12s; }
        .animate-in > *:nth-child(4) { animation-delay: 0.18s; }
        .animate-in > *:nth-child(5) { animation-delay: 0.24s; }
        .animate-in > *:nth-child(6) { animation-delay: 0.30s; }
        .animate-in > *:nth-child(7) { animation-delay: 0.36s; }
        .animate-in > *:nth-child(8) { animation-delay: 0.42s; }
        .emulator-badge {
            position: fixed; right: 10px; bottom: 10px; z-index: 50;
            background: #FFA500; color: #111; font-weight: 800; font-size: 12px;
            padding: 5px 10px; border-radius: 6px;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
    <style>
        /* ===== v2.0 Emerald look (this file only; iaiom.html keeps the Classic look) ===== */
        .widget-container { font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif; border-radius: 22px; overflow: hidden; box-shadow: 0 24px 48px -28px rgba(10, 47, 53, 0.55); }
        .widget-header { background: linear-gradient(135deg, #0A2F35 0%, #0F4A47 55%, #00A86B 100%); }
        .widget-title { font-weight: 800; }
        .hijri-date { color: #7FE0B5; font-style: normal; font-weight: 600; }
        .em-next { display: flex; align-items: center; gap: 14px; margin: 16px auto 6px; padding: 8px 18px 8px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.10); width: fit-content; color: #FFFFFF; }
        .em-ring-s { width: 56px; height: 56px; flex: none; }
        .em-ring-s .tr { fill: none; stroke: rgba(255, 255, 255, 0.22); stroke-width: 9; }
        .em-ring-s .pr { fill: none; stroke: #7FE0B5; stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray 0.8s ease; }
        .em-next-in { display: grid; text-align: left; line-height: 1.25; }
        .em-next-in small { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7FE0B5; font-weight: 700; }
        #emNextName { font-size: 19px; font-weight: 800; }
        #emNextWhen { font-size: 13px; opacity: 0.9; }
        .section-title { font-weight: 800; color: #0A2F35; }
        .em-cols { display: grid; grid-template-columns: 1.45fr 3fr; padding: 0 16px; margin: 4px 0 6px; }
        .em-cols > div { display: grid; grid-template-columns: repeat(3, 1fr); }
        .em-cols span { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5E7276; }
        .prayers-grid { gap: 8px; }
        .prayer-card { display: grid; grid-template-columns: 1.45fr 3fr; align-items: center; padding: 11px 16px; border-radius: 16px; border: 1px solid #DCE6E3; background: #F7FAF9; box-shadow: none; }
        .prayer-card:hover { transform: none; box-shadow: 0 6px 18px -12px rgba(10, 47, 53, 0.5); }
        .prayer-card.next-prayer { background: #E3F5EC; border: 1.5px solid #00A86B; }
        .prayer-header { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 0; border: 0; }
        .prayer-name-en { font-size: 17px; font-weight: 700; color: #10262A; }
        .prayer-name-ar { font-size: 15px; color: #5E7276; }
        .prayer-times-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .time-box { background: transparent; border: 0; padding: 0; box-shadow: none; text-align: center; }
        .time-label { display: none; }
        .time-value { font-size: 17px; font-weight: 600; color: #10262A; font-variant-numeric: tabular-nums; }
        .prayer-card.next-prayer .time-value { color: #0A2F35; font-weight: 800; }
        .special-card { border-radius: 16px; border: 1px solid #DCE6E3; background: #F7FAF9; }
        .special-time { color: #00875A; }
        .widget-footer { background: #F3F6F5; }
        @media (max-width: 520px) {
            .em-cols, .prayer-card { grid-template-columns: 1.15fr 3fr; }
            .prayer-header { flex-direction: column; gap: 0; }
            .prayer-name-en, .time-value { font-size: 15px; }
            .prayer-card { padding: 10px 12px; }
        }
        @media (prefers-reduced-motion: reduce) { .em-ring-s .pr { transition: none; } }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="loading">
        🕌 Loading Prayer Times...
    </div>

    <!-- v2: shown only in local testing (?emulator on localhost) -->
    <div id="emulatorBadge" class="emulator-badge hidden">EMULATOR · local test data, not live</div>

    <!-- Widget -->
    <div id="widget" class="widget-container hidden">
        <!-- Header -->
        <div class="widget-header">
            <div class="widget-title">Isle of Man Islamic Centre</div>
            <div class="widget-subtitle">Prayer Times</div>
            <div class="date-container">
                <div class="gregorian-date" id="widgetDate">Loading...</div>
                <div class="hijri-date" id="hijriDate">Loading...</div>
            </div>

            <!-- v2.0 Emerald: the next prayer, with a ring that fills until it begins -->
            <div class="em-next" id="emNext" aria-live="off">
                <svg class="em-ring-s" viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="42"/><circle class="pr" id="emRing" cx="50" cy="50" r="42" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 50 50)"/></svg>
                <div class="em-next-in"><small>Next prayer</small><span id="emNextName">...</span><span id="emNextWhen"></span></div>
            </div>
            
            <!-- Store Icons -->
            <div class="store-section">
                <a href="https://play.google.com/store/apps/details?id=com.iomprayertimes" class="store-link" id="androidStoreLink" target="_blank" rel="noopener">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play" class="store-icon">
                </a>
                <a href="https://apps.apple.com/gb/app/iom-prayer-times/id6758450458" class="store-link" target="_blank" rel="noopener">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="Download on the App Store" class="store-icon">
                </a>
            </div>
        </div>

        <!-- Content -->
        <div class="widget-content">
            <!-- Daily Prayers -->
            <div class="daily-header">
                <div class="section-title" id="dailyTitle">Daily Prayers</div>
                <div class="day-tabs hidden" id="dayTabs" role="tablist" aria-label="Choose the day">
                    <button type="button" class="day-tab active" data-day="today" role="tab" aria-selected="true">Today</button>
                    <button type="button" class="day-tab" data-day="tomorrow" role="tab" aria-selected="false">Tomorrow</button>
                </div>
            </div>
            <div class="em-cols" aria-hidden="true"><span></span><div><span>Begins</span><span>Adhan</span><span>Iqama</span></div></div>
            <div class="prayers-grid" id="prayersGrid">
                <!-- Prayer cards will be inserted here -->
            </div>

            <!-- Special Prayers -->
            <div id="specialSection">
                <div class="section-title">Special Prayers</div>
                <div class="special-prayers-grid" id="specialPrayersGrid">
                    <!-- Special prayer cards will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="widget-footer">
            <div class="footer-item">
                <div class="footer-label">Location</div>
                <div class="footer-value" id="location">Loading...</div>
            </div>
            <div class="footer-item">
                <div class="footer-label">Calculation Method</div>
                <div class="footer-value" id="method">Loading...</div>
            </div>
            <div class="footer-item">
                <div class="footer-label">Juristic School</div>
                <div class="footer-value" id="school">Loading...</div>
            </div>
            <div class="footer-item">
                <div class="footer-label">Offsets (mins)</div>
                <div class="footer-value" id="offsets">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, getDoc, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDQc-8A1Zkz4RnRt54rW4DdaA_v0rfLIBQ",
            authDomain: "iompt-f5b68.firebaseapp.com",
            projectId: "iompt-f5b68",
            storageBucket: "iompt-f5b68.firebasestorage.app",
            messagingSenderId: "111581192358",
            appId: "1:111581192358:web:c9d7be70cc72d8e0ca5467",
            measurementId: "G-TNN65XD7L2"
        };

        // Initialize Firebase
        console.log('🔥 Initializing Firebase...');
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        console.log('✅ Firebase initialized');

        // v2: local testing only. Active only on localhost AND with ?emulator in the URL.
        const USE_EMULATOR = ['localhost', '127.0.0.1'].includes(location.hostname)
            && new URLSearchParams(location.search).has('emulator');
        if (USE_EMULATOR) {
            connectFirestoreEmulator(db, '127.0.0.1', 8080);
            document.getElementById('emulatorBadge').classList.remove('hidden');
            console.warn('🧪 Using the local Firestore emulator (test data, not live)');
        }

        // v2: everything inserted as HTML is escaped first
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        // v2: only touch the page when the content changed (keeps the gentle animations smooth)
        const lastRenderedHtml = {};
        function setHtmlIfChanged(container, html, key) {
            if (lastRenderedHtml[key] === html) return false;
            lastRenderedHtml[key] = html;
            container.innerHTML = html;
            return true;
        }

        // v2: which daily prayer is next (same rule as the app: the first start time still to come)
        function getNextPrayerKey() {
            const now = new Date();
            const nowMinutes = now.getHours() * 60 + now.getMinutes();
            const order = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
            for (const key of order) {
                const t = prayerData.prayers[key]?.apt;
                if (!t || !/^\d{1,2}:\d{2}$/.test(t)) continue;
                const [h, m] = t.split(':').map(Number);
                if (h * 60 + m > nowMinutes) return key;
            }
            return 'fajr'; // after Isha: tomorrow's Fajr
        }

        // ── v2: Special prayers created by the admin (Firestore: prayerTimes/specialPrayers) ──
        // Each item: { id, name, date: 'YYYY-MM-DD', time: 'HH:MM', showFrom, hideAfter }
        // (showFrom and hideAfter are 'YYYY-MM-DDTHH:MM' local time). Shown while showFrom <= now < hideAfter.
        const SP_TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
        const SP_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
        const SP_DATETIME_RE = /^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d$/;
        let customSpecials = [];

        function spPad(n) { return String(n).padStart(2, '0'); }
        function spDateKey(d) { return `${d.getFullYear()}-${spPad(d.getMonth() + 1)}-${spPad(d.getDate())}`; }
        function spMinuteKey(d) { return `${spDateKey(d)}T${spPad(d.getHours())}:${spPad(d.getMinutes())}`; }
        function spAddMinutes(dateKey, time, minutes) {
            const [y, m, d] = dateKey.split('-').map(Number);
            const [hh, mm] = time.split(':').map(Number);
            return spMinuteKey(new Date(y, m - 1, d, hh, mm + minutes));
        }
        function parseSpecialPrayers(data) {
            const list = data && Array.isArray(data.list) ? data.list : [];
            return list.map(raw => {
                if (!raw || typeof raw !== 'object') return null;
                const name = typeof raw.name === 'string' ? raw.name.trim().slice(0, 60) : '';
                const date = String(raw.date || '');
                const time = String(raw.time || '');
                if (!name || !SP_DATE_RE.test(date) || !SP_TIME_RE.test(time)) return null;
                const showFrom = SP_DATETIME_RE.test(String(raw.showFrom || '')) ? raw.showFrom : '';
                const hideAfter = SP_DATETIME_RE.test(String(raw.hideAfter || '')) ? raw.hideAfter : spAddMinutes(date, time, 60);
                return { id: String(raw.id ?? `${date}T${time}`), name, date, time, showFrom, hideAfter };
            }).filter(Boolean).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
        }
        function isSpecialPrayerVisible(item, now) {
            const key = spMinuteKey(now || new Date());
            return (!item.showFrom || item.showFrom <= key) && key < item.hideAfter;
        }
        function formatSpecialWhen(item, now) {
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            if (item.date === spDateKey(now)) return `Today ${item.time}`;
            if (item.date === spDateKey(tomorrow)) return `Tomorrow ${item.time}`;
            const [y, m, d] = item.date.split('-').map(Number);
            const day = new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
            return `${day} ${item.time}`;
        }
        // Returns the list, [] if the document does not exist, or null if it could not be read
        async function fetchSpecialPrayers() {
            try {
                const snap = await getDoc(doc(db, FIREBASE_CONFIG.COLLECTION, 'specialPrayers'));
                return snap.exists() ? parseSpecialPrayers(snap.data()) : [];
            } catch (error) {
                console.warn('⚠️ Special prayers not available:', error.code || error.message);
                return null;
            }
        }

        const FIREBASE_CONFIG = {
            COLLECTION: 'prayerTimes',
            DOCUMENTS: {
                API_CONFIG:      'apiConfig',
                DAILY_CONFIG:    'dailyConfig',
                FALLBACK_RULES:  'fallbackRules',
                SCHEDULED_TIMES: 'scheduledTimes',
            }
        };

        // Prayer name translations
        const PRAYER_NAMES = {
            fajr: { en: 'Fajr', ar: 'الفجر' },
            sunrise: { en: 'Sunrise', ar: 'الشروق' },
            dhuhr: { en: 'Dhuhr', ar: 'الظهر' },
            asr: { en: 'Asr', ar: 'العصر' },
            maghrib: { en: 'Maghrib', ar: 'المغرب' },

        // Fetch prayer times from Aladhan API
        async function fetchPrayerTimesFromAladhan(apiConfig, date) {
            try {
                const today = date || new Date(); // v2: any date, tomorrow too
                const dateStr = `${String(today.getDate()).padStart(2, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}-${today.getFullYear()}`;
                
                const url = `https://api.aladhan.com/v1/timings/${dateStr}?latitude=${apiConfig.latitude}&longitude=${apiConfig.longitude}&method=${apiConfig.method}&school=0`;
                
                console.log('🌐 Fetching from Aladhan API:', url);
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === 200 && data.data) {
                    console.log('✅ Prayer times fetched from Aladhan');
                    const timings = data.data.timings;
                    const offsets = apiConfig.offsetMinutes;
                    
                    // Store Hijri date information
                    if (!date && data.data.date && data.data.date.hijri) { // v2: only today's sets the Hijri line
                        hijriDateData = data.data.date.hijri;
                        console.log('✅ Hijri date extracted:', hijriDateData);
                    }
                    
                    // Apply offsets
                    const applyOffset = (time, offset) => {
                        if (!time) return '00:00';
                        const [hours, minutes] = time.split(':').map(Number);
                        const totalMinutes = hours * 60 + minutes + offset;
                        const newHours = Math.floor(totalMinutes / 60) % 24;
                        const newMinutes = totalMinutes % 60;
                        return `${String(newHours).padStart(2, '0')}:${String(newMinutes).padStart(2, '0')}`;
                    };
                    
                    return {
                        fajr: applyOffset(timings.Fajr, offsets.fajr),
                        sunrise: applyOffset(timings.Sunrise, 0),
                        dhuhr: applyOffset(timings.Dhuhr, offsets.dhuhr),
                        asr: applyOffset(timings.Asr, offsets.asr),
                        maghrib: applyOffset(timings.Maghrib, offsets.maghrib),
                        isha: applyOffset(timings.Isha, offsets.isha),
                    };
                } else {
                    console.error('❌ Invalid response from Aladhan API');
                    return null;
                }
            } catch (error) {
                console.error('❌ Error fetching from Aladhan:', error);
                return null;
            }
        }

        // Returns today's date key as YYYY-MM-DD
        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Returns true only if a time string is valid, non-empty, non-zero
        function isValidTime(t) {
            return !!t && t !== '' && t !== '00:00';
        }

        // Fetch per-date scheduled times from Firebase (① highest priority)
        // Non-fatal: returns null if document missing or no entry for today
        async function fetchScheduledTimesForToday(dateKey) {
            try {
                const docRef = doc(db, FIREBASE_CONFIG.COLLECTION, FIREBASE_CONFIG.DOCUMENTS.SCHEDULED_TIMES);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    console.log('📅 No scheduledTimes document — using daily config');
                    return null;
                }

                const all = docSnap.data();
                const todayKey = dateKey || getTodayKey(); // v2: any date, tomorrow too
                const todayEntry = all?.[todayKey];

                if (!todayEntry) {
                    console.log(`📅 No scheduled entry for today (${todayKey}) — using daily config`);
                    return null;
                }

                console.log(`✅ Scheduled times found for today (${todayKey})`);
                return todayEntry;
            } catch (error) {
                console.error('❌ Error fetching scheduled times (falling back to daily config):', error);
                return null;
            }
        }

        // Load all data
        async function loadPrayerData() {
            try {
                console.log('🔄 Loading prayer data...');
                
                // Fetch API config
                const apiConfig = await fetchApiConfig();
                if (!apiConfig) {
                    console.error('❌ Failed to load API config');
                    return false;
                }
                
                // Fetch daily config
                const dailyConfig = await fetchDailyConfig();
                if (!dailyConfig) {
                    console.error('❌ Failed to load daily config');
                    return false;
                }
                
                // Fetch scheduled times for today (① priority — overrides dailyConfig when set)
                const scheduled = await fetchScheduledTimesForToday();

                // v2: admin special prayers. Never fatal: if the read fails, the previous list is kept.
                const specials = await fetchSpecialPrayers();
                if (specials !== null) customSpecials = specials;

                // Fetch fallback rules
                const fallbackRules = await fetchFallbackRules();
                console.log('📋 Fallback rules loaded:', fallbackRules);
                
                // Fetch prayer times from Aladhan
                const aladhanTimes = await fetchPrayerTimesFromAladhan(apiConfig);
                if (!aladhanTimes) {
                    console.error('❌ Failed to load Aladhan times');
                    return false;
                }
                
                // Helper function to add minutes to a time
                const addMinutes = (timeStr, minutesToAdd) => {
                    if (!timeStr || timeStr === '--:--' || timeStr === '00:00') return '00:00';
                    const [hours, minutes] = timeStr.split(':').map(Number);
                    const totalMinutes = hours * 60 + minutes + minutesToAdd;
                    const newHours = Math.floor(totalMinutes / 60) % 24;
                    const newMinutes = totalMinutes % 60;
                    return `${String(newHours).padStart(2, '0')}:${String(newMinutes).padStart(2, '0')}`;
                };
                
                // MAT/MIT Priority:
                //   ① scheduled[prayer].mat/mit  — per-date override (if set)
                //   ② dailyConfig.mat/mit[prayer] — default manual times
                //   ③ APT + fallbackRules offset  — auto fallback
                const processPrayerTimes = (prayer, dayTimes = aladhanTimes, dayScheduled = scheduled) => {
                    const apt = dayTimes[prayer];
                    const rules = fallbackRules[prayer];

                    // Resolve MAT
                    const schedMat = dayScheduled?.[prayer]?.mat;
                    const dailyMat = dailyConfig.mat[prayer];
                    let mat;
                    if (isValidTime(schedMat)) {
                        mat = schedMat;
                        console.log(`📅 ${prayer}: MAT from scheduledTimes (${mat})`);
                    } else if (isValidTime(dailyMat)) {
                        mat = dailyMat;
                    } else {
                        mat = addMinutes(apt, rules.matOffset);
                        console.log(`ℹ️ ${prayer}: MAT fallback APT + ${rules.matOffset} mins (${mat})`);
                    }

                    // Resolve MIT
                    const schedMit = dayScheduled?.[prayer]?.mit;
                    const dailyMit = dailyConfig.mit[prayer];
                    let mit;
                    if (isValidTime(schedMit)) {
                        mit = schedMit;
                        console.log(`📅 ${prayer}: MIT from scheduledTimes (${mit})`);
                    } else if (isValidTime(dailyMit)) {
                        mit = dailyMit;
                    } else {
                        mit = addMinutes(mat, rules.mitOffset);
                        console.log(`ℹ️ ${prayer}: MIT fallback MAT + ${rules.mitOffset} mins (${mit})`);
                    }
                    
                    return { apt, mat, mit };
                };
                
                // v2: tomorrow's times for the Tomorrow tab. Never fatal.
                let tomorrow = null;
                try {
                    const nowDate = new Date();
                    const tomorrowDate = new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate() + 1);
                    const tomorrowKey = spDateKey(tomorrowDate);
                    const [tomorrowTimes, tomorrowScheduled] = await Promise.all([
                        fetchPrayerTimesFromAladhan(apiConfig, tomorrowDate),
                        fetchScheduledTimesForToday(tomorrowKey),
                    ]);
                    if (tomorrowTimes) {
                        tomorrow = {
                            dateKey: tomorrowKey,
                            label: tomorrowDate.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
                            prayers: {
                                fajr: processPrayerTimes('fajr', tomorrowTimes, tomorrowScheduled),
                                sunrise: { apt: tomorrowTimes.sunrise, mat: '--:--', mit: '--:--' },
                                dhuhr: processPrayerTimes('dhuhr', tomorrowTimes, tomorrowScheduled),
                                asr: processPrayerTimes('asr', tomorrowTimes, tomorrowScheduled),
                                maghrib: processPrayerTimes('maghrib', tomorrowTimes, tomorrowScheduled),
                                isha: processPrayerTimes('isha', tomorrowTimes, tomorrowScheduled)
                            }
                        };
                    }
                } catch (error) {
                    console.warn("⚠️ Tomorrow's times not available:", error);
                }

                // Combine all data with smart fallbacks
                prayerData = {
                    prayers: {
                        fajr: processPrayerTimes('fajr'),
                        sunrise: { apt: aladhanTimes.sunrise, mat: '--:--', mit: '--:--' },
                        dhuhr: processPrayerTimes('dhuhr'),
                        asr: processPrayerTimes('asr'),
                        maghrib: processPrayerTimes('maghrib'),
                        isha: processPrayerTimes('isha')
                    },
                    specialPrayers: dailyConfig.specialPrayers,
                    tomorrow, // v2
                    config: {
                        location: 'Isle of Man',
                        method: apiConfig.methodName,
                        school: apiConfig.schoolName,
                        offsets: apiConfig.offsetMinutes
                    }
                };
                
                console.log('✅ All prayer data loaded:', prayerData);
                return true;
            } catch (error) {
                console.error('❌ Error loading prayer data:', error);
                return false;
            }
        }

        // v2.0 Emerald: next prayer and a ring from the previous prayer's start to the next one
        function emMinutes(t) {
            if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }
        function updateEmeraldNext() {
            if (!prayerData || !prayerData.prayers || !document.getElementById('emNext')) return;
            const now = new Date();
            const nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
            const starts = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha']
                .map(k => ({ k, m: emMinutes(prayerData.prayers[k] && prayerData.prayers[k].apt) }))
                .filter(x => x.m !== null);
            if (!starts.length) return;
            let next = starts.find(x => x.m > nowMinutes);
            let prev;
            let nextTime;
            if (next) {
                const before = starts.filter(x => x.m <= nowMinutes);
                prev = before.length ? before[before.length - 1].m : starts[starts.length - 1].m - 1440;
                nextTime = prayerData.prayers[next.k].apt;
            } else {
                const tomorrowFajr = prayerData.tomorrow && prayerData.tomorrow.prayers && prayerData.tomorrow.prayers.fajr ? prayerData.tomorrow.prayers.fajr.apt : prayerData.prayers.fajr.apt;
                next = { k: 'fajr', m: (emMinutes(tomorrowFajr) ?? starts[0].m) + 1440 };
                prev = starts[starts.length - 1].m;
                nextTime = tomorrowFajr;
            }
            const done = Math.min(1, Math.max(0, (nowMinutes - prev) / (next.m - prev)));
            const left = Math.max(0, Math.ceil(next.m - nowMinutes));
            document.getElementById('emRing').setAttribute('stroke-dasharray', `${(done * 100).toFixed(1)} 100`);
            document.getElementById('emNextName').textContent = PRAYER_NAMES[next.k].en;
            const inText = left >= 60 ? `in ${Math.floor(left / 60)} h ${String(left % 60).padStart(2, '0')} min` : `in ${left} min`;
            document.getElementById('emNextWhen').textContent = `${nextTime || ''}${next.m >= 1440 ? ' tomorrow' : ''} · ${inText}`;
        }

                    if (special.eidAdha.prayer2 && special.eidAdha.prayer2.time) {
                        if (timeDisplay) timeDisplay += ' / ';
                        timeDisplay += `2nd: ${special.eidAdha.prayer2.time}`;
                    }
                    
                    html += `
                        <div class="special-card">
                            <div class="special-name-wrapper">
                                <div class="special-name-en">${PRAYER_NAMES.eidAdha.en}</div>
                                <div class="special-name-ar">${PRAYER_NAMES.eidAdha.ar}</div>
                            </div>
                            <div class="special-time">${escapeHtml(timeDisplay)}</div>
                        </div>
                    `;
                }
            }

            // v2: admin-created special prayers (only while visible)
            const now = new Date();
            customSpecials.filter(sp => isSpecialPrayerVisible(sp, now)).forEach(sp => {
                hasSpecialPrayers = true;
                html += `
                    <div class="special-card" data-custom-id="${escapeHtml(sp.id)}">
                        <div class="special-name-wrapper">
                            <div class="special-name-en">${escapeHtml(sp.name)}</div>
                        </div>
                        <div class="special-time">${escapeHtml(formatSpecialWhen(sp, now))}</div>
                    </div>
                `;
            });

            setHtmlIfChanged(container, html || '<div style="padding: 20px; color: #6C757D; text-align: center;">No special prayers today</div>', 'specials');
        }

        // Update configuration info
        function updateConfigInfo() {
            document.getElementById('location').textContent = prayerData.config.location;
            document.getElementById('method').textContent = prayerData.config.method;
            document.getElementById('school').textContent = prayerData.config.school;

            // Build offset display: only show non-zero values
            const o = prayerData.config.offsets || {};
            const parts = [
                o.fajr    ? `Fajr ${o.fajr > 0 ? '+' : ''}${o.fajr}`        : null,
                o.dhuhr   ? `Dhuhr ${o.dhuhr > 0 ? '+' : ''}${o.dhuhr}`      : null,
                o.asr     ? `Asr ${o.asr > 0 ? '+' : ''}${o.asr}`            : null,
                o.maghrib ? `Maghrib ${o.maghrib > 0 ? '+' : ''}${o.maghrib}` : null,
                o.isha    ? `Isha ${o.isha > 0 ? '+' : ''}${o.isha}`          : null,
            ].filter(Boolean);
            document.getElementById('offsets').textContent = parts.length ? parts.join(', ') : 'None';
        }

        // Update date
        function updateDate() {
            // Update Gregorian date
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('widgetDate').textContent = now.toLocaleDateString('en-GB', options);
            
            // Update Hijri date
            updateHijriDate();
        }

        // Update Hijri date
        function updateHijriDate() {
            const hijriElement = document.getElementById('hijriDate');
            
            if (hijriDateData) {
                // Format Hijri date: Day Month Year
                const day = hijriDateData.day;
                const month = hijriDateData.month.en;
                const year = hijriDateData.year;
                
                hijriElement.textContent = `${day} ${month} ${year} AH`;
                console.log('✅ Hijri date displayed:', hijriElement.textContent);
            } else {
                hijriElement.textContent = 'Hijri date unavailable';
                console.warn('⚠️ Hijri date data not available');
            }
        }

        // Initialize widget
        async function init() {
            console.log('🚀 Initializing Prayer Times Widget...');
            
            // Load data from Firebase and Aladhan
            const success = await loadPrayerData();
            
            if (!success) {
                document.getElementById('loading').innerHTML = '❌ Failed to load prayer data. Please refresh the page.';
                return;
            }
            
            // Hide loading, show widget
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('widget').classList.remove('hidden');

            // v2: gentle entrance on the first render only
            const widget = document.getElementById('widget');
            const lists = [document.getElementById('prayersGrid'), document.getElementById('specialPrayersGrid')];
            widget.classList.add('widget-enter');
            lists.forEach(el => el.classList.add('animate-in'));
            setTimeout(() => {
                widget.classList.remove('widget-enter');
                lists.forEach(el => el.classList.remove('animate-in'));
            }, 2000);
            
            // Render all content
            renderPrayerTimes();
            renderSpecialPrayers();
            updateConfigInfo();
            updateDate();
            
            console.log('✅ Widget initialized successfully');

            // v2: keep a page that is left open correct.
            // Every minute: the next-prayer highlight and which special prayers are visible.
            // Every 30 minutes and just after midnight: fresh times (if a refresh fails, the page keeps what it shows).
            const refresh = async () => {
                if (await loadPrayerData()) {
                    renderPrayerTimes();
                    renderSpecialPrayers();
                    updateConfigInfo();
                    updateDate();
                }
            };
            setInterval(() => { renderPrayerTimes(); renderSpecialPrayers(); }, 60 * 1000);
            setInterval(refresh, 30 * 60 * 1000);
            const scheduleMidnightRefresh = () => {
                const now = new Date();
                const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 30);
                setTimeout(async () => { selectedDay = 'today'; await refresh(); scheduleMidnightRefresh(); }, next - now);
            };
            scheduleMidnightRefresh();
        }

        // v2: Today | Tomorrow tabs
        let selectedDay = 'today';
        document.getElementById('dayTabs')?.addEventListener('click', (event) => {
            const tab = event.target.closest('.day-tab');
            if (!tab || tab.dataset.day === selectedDay) return;
            selectedDay = tab.dataset.day;
            const grid = document.getElementById('prayersGrid');
            grid.classList.remove('animate-in');
            void grid.offsetWidth; // replay the gentle entrance
            grid.classList.add('animate-in');
            setTimeout(() => grid.classList.remove('animate-in'), 900);
            renderPrayerTimes();
        });

        // Start the widget
        window.addEventListener('DOMContentLoaded', () => {
            console.log('📱 DOM loaded, starting initialization...');
            init();
        });
    </script>
</body>
</html>
